<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slot Machine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f0f1a;
        touch-action: manipulation;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      canvas#game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }

      canvas.lottie-canvas {
        display: block;
        width: min(600px, 85vw);
        aspect-ratio: 16 / 9;
        height: auto;
        max-width: 100%;
        transform: translateX(-5%);
      }

      .launch-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        pointer-events: none;
        z-index: 10;
      }

      .pause-overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: rgba(15, 15, 26, 0.88);
        z-index: 20;
        touch-action: manipulation;
        cursor: pointer;
      }

      .pause-overlay__message {
        font-family: Arial, sans-serif;
        font-size: clamp(18px, 4vw, 24px);
        font-weight: 600;
        color: #ffffff;
        text-align: center;
        user-select: none;
      }
    </style>
